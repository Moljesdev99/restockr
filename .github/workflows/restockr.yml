name: Restockr

on:
  schedule:
    # Every 20 min (odd minutes avoid GitHub's busy :00). The concurrency group
    # keeps only one watch run active. A successful or cancelled watch also
    # dispatches the next run so the handoff does not wait for cron. GitHub
    # keeps only one *pending* run per group and drops older queued ones.
    # The next start always waits until this workflow (including state save)
    # has finished.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "watch = normal watch · test = one summary, no live state"
        type: choice
        options: [watch, test]
        default: watch

concurrency:
  group: restockr-${{ github.event.inputs.mode == 'test' && 'test' || 'watch' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # GitHub's job cap is 6 hours. Leave a few minutes after RUN_MINUTES for
    # the save / artifact steps, including after a timeout or cancel.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7

      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Restore last state
        if: ${{ (github.event.inputs.mode || 'watch') == 'watch' }}
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: state.json
          key: restockr-state-${{ github.run_id }}
          restore-keys: restockr-state-

      - name: Restore state from last artifact
        if: ${{ (github.event.inputs.mode || 'watch') == 'watch' && steps.cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore_state_artifact.sh

      - name: Watch
        id: watch
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'watch' }}
          RUN_MINUTES: "340"
          PYTHONUNBUFFERED: "1"
        run: .venv/bin/python restockr.py

      - name: Save state
        if: ${{ always() && (github.event.inputs.mode || 'watch') == 'watch' }}
        uses: actions/cache/save@v6
        with:
          path: state.json
          key: restockr-state-${{ github.run_id }}

      - name: Upload state artifact
        if: ${{ always() && (github.event.inputs.mode || 'watch') == 'watch' && hashFiles('state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: restockr-state
          path: state.json
          retention-days: 14
          if-no-files-found: ignore

      # Queue the next watch immediately after this job (including state save)
      # finishes. Concurrency still allows only one active watch. Cron remains
      # as a backup if this dispatch is skipped (failed/short runs).
      - name: Queue the next watch run
        if: ${{ always() && (github.event.inputs.mode || 'watch') == 'watch' && (steps.watch.conclusion == 'success' || steps.watch.conclusion == 'cancelled') }}
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: gh workflow run restockr.yml --ref "$GITHUB_REF_NAME" -f mode=watch
