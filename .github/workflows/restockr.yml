name: Restockr

on:
  schedule:
    # Every 20 min (odd minutes avoid GitHub's busy :00). The concurrency group
    # keeps only one watch run active. A second run may wait, but GitHub keeps
    # only one *pending* run per group and drops older queued ones — so a long
    # run plus delayed cron can still leave a short gap. The next start always
    # waits until this workflow (including state save) has finished.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "watch = normal watch · test = one summary, no live state"
        type: choice
        options: [watch, test]
        default: watch

concurrency:
  group: restockr-${{ github.event.inputs.mode == 'test' && 'test' || 'watch' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    # GitHub's job cap is 6 hours. Leave a few minutes after RUN_MINUTES for
    # the save / artifact steps, including after a timeout or cancel.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7

      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Restore last state
        if: ${{ (github.event.inputs.mode || 'watch') == 'watch' }}
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: state.json
          key: restockr-state-${{ github.run_id }}
          restore-keys: restockr-state-

      - name: Restore state from last artifact
        if: ${{ (github.event.inputs.mode || 'watch') == 'watch' && steps.cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore_state_artifact.sh

      - name: Watch
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'watch' }}
          RUN_MINUTES: "340"
          PYTHONUNBUFFERED: "1"
        run: .venv/bin/python restockr.py

      - name: Save state
        if: ${{ always() && (github.event.inputs.mode || 'watch') == 'watch' }}
        uses: actions/cache/save@v6
        with:
          path: state.json
          key: restockr-state-${{ github.run_id }}

      - name: Upload state artifact
        if: ${{ always() && (github.event.inputs.mode || 'watch') == 'watch' && hashFiles('state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: restockr-state
          path: state.json
          retention-days: 14
          if-no-files-found: ignore
